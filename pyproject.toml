[project]
name = "pepkio-rapiddot-genome-viewer"
version = "0.1.0"
description = "Python client for Pepkio rapiddot-genome-viewer tool"
readme = "README_PYPI.md"
requires-python = ">=3.10"
authors = [
    { name = "Pepkio Team", email = "tools@pepkio.com" }
]
dependencies = [
    "click>=8.1.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.scripts]
pepkio-rapiddot-genome-viewer = "pepkio_rapiddot_genome_viewer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pepkio_rapiddot_genome_viewer"]

[dependency-groups]
dev = [
    "hatchling>=1.32.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "python-dotenv>=1.0.0",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
